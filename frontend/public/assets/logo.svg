<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="gemEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <linearGradient id="gemPeach" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Orbital Halo Ring 1 -->
  <ellipse cx="100" cy="100" rx="88" ry="38" fill="none" stroke="url(#gemPeach)" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.6" transform="rotate(-28 100 100)" />
  
  <!-- Orbital Halo Ring 2 -->
  <ellipse cx="100" cy="100" rx="88" ry="38" fill="none" stroke="url(#gemEmerald)" stroke-width="2.5" opacity="0.5" transform="rotate(35 100 100)" />

  <!-- Orbit Nodes -->
  <circle cx="32" cy="65" r="4.5" fill="#fde047" filter="url(#glow)" />
  <circle cx="168" cy="135" r="5.5" fill="#34d399" filter="url(#glow)" />

  <!-- 3D Geometric Isometric Crystal Hexagon / Nexus Diamond -->
  <!-- Back / Shadow facet -->
  <polygon points="100,24 162,60 162,140 100,176 38,140 38,60" fill="#022c22" stroke="#064e3b" stroke-width="2" />

  <!-- Left Facet (Deep Emerald) -->
  <polygon points="100,100 38,60 38,140 100,176" fill="url(#gemEmerald)" opacity="0.95" />

  <!-- Right Facet (Sunburst Peach & Gold) -->
  <polygon points="100,100 162,60 162,140 100,176" fill="url(#gemPeach)" opacity="0.9" />

  <!-- Top Facet (Refractive Light Gem) -->
  <polygon points="100,24 162,60 100,100 38,60" fill="url(#facetLight)" />

  <!-- Central Nexus Core Prism -->
  <polygon points="100,55 135,78 135,122 100,145 65,122 65,78" fill="url(#coreGlow)" filter="url(#glow)" opacity="0.85" />
  
  <!-- Stylized 'N' Brand Line Inside Core -->
  <path d="M 82 124 L 82 76 L 118 124 L 118 76" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Sparkling Specular Nodes -->
  <polygon points="100,18 103,24 100,30 97,24" fill="#ffffff" />
  <polygon points="165,58 171,60 165,62 159,60" fill="#fef08a" />
  <polygon points="35,58 41,60 35,62 29,60" fill="#34d399" />
</svg>